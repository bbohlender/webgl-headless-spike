name: spike

# One stack on every platform: Node addon -> ANGLE (Vulkan backend only) -> Mesa lavapipe.
# angle + mesa build the two native pieces per platform; test runs the identical test set.
on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANGLE_COMMIT: 3e8d04799eaee75e192e00578ff66b28c4fb95ce
  MESA_VERSION: 26.2.4
  LLVM_VERSION: 23.1.3
  DEPOT_TOOLS_UPDATE: "0"
  DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
  GCLIENT_SUPPRESS_GIT_VERSION_WARNING: "1"

jobs:
  angle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac-arm64, os: macos-15, cpu: arm64 }
          - { id: mac-x64, os: macos-15-intel, cpu: x64 }
          - { id: win-x64, os: windows-2022, cpu: x64 }
          - { id: linux-x64, os: ubuntu-24.04, cpu: x64 }
          - { id: linux-arm64, os: ubuntu-24.04, cpu: arm64 } # cross-compiled, tested on an arm64 runner
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: depot_tools
        run: |
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
      - name: Fetch ANGLE
        run: |
          mkdir angle && cd angle
          git init -q && git remote add origin https://chromium.googlesource.com/angle/angle
          git fetch -q --depth 1 origin "$ANGLE_COMMIT" && git checkout -q FETCH_HEAD
          python3 ../spike/ci/write_gclient.py ${{ matrix.id }} > .gclient
      - name: gclient sync (Unix)
        if: runner.os != 'Windows'
        working-directory: angle
        run: gclient sync --no-history -j 8
      - name: gclient sync (Windows)
        if: runner.os == 'Windows'
        working-directory: angle
        shell: cmd
        run: gclient sync --no-history -j 8
      - name: Patch (macOS Vulkan-only frameworks)
        if: runner.os == 'macOS'
        working-directory: angle
        run: git apply ../spike/patches/angle-vulkan-mac-frameworks.patch
      - name: GN args
        working-directory: angle
        run: mkdir -p out/vk && python3 ../spike/ci/angle_args.py ${{ matrix.id }} ${{ matrix.cpu }} | tr ' ' '\n' > out/vk/args.gn && cat out/vk/args.gn
      - name: Build (Unix)
        if: runner.os != 'Windows'
        working-directory: angle
        run: gn gen out/vk && autoninja -C out/vk libEGL libGLESv2
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: angle
        shell: cmd
        run: |
          call gn gen out/vk || exit /b 1
          call autoninja -C out/vk libEGL libGLESv2 || exit /b 1
      - name: Collect
        run: |
          mkdir -p ../pkg && cd out/vk
          for f in libEGL.dylib libGLESv2.dylib libEGL.so libGLESv2.so libEGL.dll libGLESv2.dll vulkan-1.dll libvulkan.so.1; do [ -f "$f" ] && cp "$f" ../../../pkg/ || true; done
          ls -la ../../../pkg
        working-directory: angle
      - uses: actions/upload-artifact@v4
        with: { name: "angle-${{ matrix.id }}", path: pkg }

  mesa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac-arm64, os: macos-15 }
          - { id: mac-x64, os: macos-15-intel }
          - { id: win-x64, os: windows-2022 }
          - { id: linux-x64, os: ubuntu-24.04 }
          - { id: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install meson ninja mako pyyaml packaging
      - name: Deps (macOS)
        if: runner.os == 'macOS'
        run: brew install bison glslang llvm
      - name: Deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq bison flex glslang-tools llvm-18-dev libpolly-18-dev libexpat1-dev zlib1g-dev libdrm-dev
      - name: Deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y winflexbison3
          curl -sfLo glslang.zip https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-master-windows-Release.zip
          7z x -oglslang glslang.zip > /dev/null
          echo "$PWD/glslang/bin" >> "$GITHUB_PATH"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Minimal LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sfL "https://github.com/llvm/llvm-project/releases/download/llvmorg-$env:LLVM_VERSION/llvm-project-$env:LLVM_VERSION.src.tar.xz" -o llvm.tar.xz
          $src = "llvm-project-$env:LLVM_VERSION.src"
          tar -xJf llvm.tar.xz "$src/llvm" "$src/cmake" "$src/third-party" "$src/libc"
          cmake -S "$src/llvm" -B llvm-build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel "-DCMAKE_INSTALL_PREFIX=$PWD/llvm-min" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_BUILD_TOOLS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_RTTI=ON
          if ($LASTEXITCODE) { exit 1 }
          ninja -C llvm-build install-llvm-libraries install-llvm-headers install-cmake-exports llvm-config
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force llvm-min/bin | Out-Null
          Copy-Item llvm-build/bin/llvm-config.exe llvm-min/bin/
          Add-Content $env:GITHUB_PATH "$PWD/llvm-min/bin"
      - name: Fetch Mesa
        run: curl -sfL "https://archive.mesa3d.org/mesa-$MESA_VERSION.tar.xz" | tar xJ
      - name: Configure + build (Unix)
        if: runner.os != 'Windows'
        run: |
          COMMON="--buildtype=minsize -Db_ndebug=true -Dstrip=true -Dgallium-drivers=llvmpipe -Dvulkan-drivers=swrast -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled -Dopengl=false -Dllvm=enabled -Dshared-llvm=disabled -Dshader-cache=enabled -Dgbm=disabled -Dvideo-codecs= -Dtools= -Dzstd=disabled -Dspirv-tools=disabled -Dvulkan-layers="
          cd "mesa-$MESA_VERSION"
          if [ "$RUNNER_OS" = macOS ]; then
            BREW=$(brew --prefix)
            export PATH="$BREW/opt/bison/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=12.0
            printf "[binaries]\nllvm-config = '$BREW/opt/llvm/bin/llvm-config'\n" > llvm.ini
            meson setup build --native-file llvm.ini --prefix="$PWD/../out" $COMMON -Dplatforms=macos -Dc_link_args=-L$BREW/lib -Dcpp_link_args=-L$BREW/lib
          else
            meson setup build --prefix="$PWD/../out" $COMMON -Dplatforms= -Dlibunwind=disabled -Dvalgrind=disabled -Dlmsensors=disabled
          fi
          ninja -C build install
      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "mesa-$env:MESA_VERSION"
          meson setup build "--prefix=$PWD/../out" --buildtype=minsize -Db_ndebug=true -Db_vscrt=md --backend=ninja `
            -Dgallium-drivers=llvmpipe -Dvulkan-drivers=swrast -Dplatforms=windows -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled `
            -Dopengl=false -Dllvm=enabled -Dshared-llvm=disabled -Dshader-cache=enabled -Dgbm=disabled -Dvideo-codecs= -Dtools= `
            -Dzstd=disabled -Dspirv-tools=disabled -Dvulkan-layers= -Dmicrosoft-clc=disabled -Dgallium-d3d12-video=disabled
          if ($LASTEXITCODE) { exit 1 }
          ninja -C build install
          if ($LASTEXITCODE) { exit 1 }
      - name: Collect
        run: |
          mkdir -p pkg
          find out \( -name 'libvulkan_lvp.*' -o -name 'vulkan_lvp.dll' \) -exec cp {} pkg/ \;
          ls -la pkg
      - uses: actions/upload-artifact@v4
        with: { name: "mesa-${{ matrix.id }}", path: pkg }

  test:
    needs: [angle, mesa]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: mac-arm64, os: macos-15 }
          - { id: mac-x64, os: macos-15-intel }
          - { id: win-x64, os: windows-2022 }
          - { id: linux-x64, os: ubuntu-24.04 }
          - { id: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      LP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: "angle-${{ matrix.id }}", path: pkg }
      - uses: actions/download-artifact@v4
        with: { name: "mesa-${{ matrix.id }}", path: pkg }
      - name: Package layout
        run: |
          node spike/ci/write_icd.mjs pkg
          ls -la pkg
          echo "ANGLE_DIR=$PWD/pkg" >> "$GITHUB_ENV"
          echo "VK_ICD_FILENAMES=$PWD/pkg/lvp_icd.json" >> "$GITHUB_ENV"
          echo "CACHE_DIR=$RUNNER_TEMP/shader-cache" >> "$GITHUB_ENV"
          echo "MESA_SHADER_CACHE_DIR=$RUNNER_TEMP/shader-cache" >> "$GITHUB_ENV"
      - name: Addon (Unix)
        if: runner.os != 'Windows'
        run: spike/harness/addon/build.sh
      - name: Addon (Windows)
        if: runner.os == 'Windows'
        working-directory: spike/harness/addon
        run: |
          python gen.py
          npx --yes node-gyp@11 rebuild
          cp build/Release/webgl.node webgl.node
      - name: npm ci + models
        working-directory: spike/harness
        run: npm ci && node prep-models.mjs && mkdir -p out
      - name: Smoke (renderer string)
        working-directory: spike/harness
        run: node render.mjs pbr out/smoke.png
      - name: Chrome references (SwiftShader)
        working-directory: spike/harness
        run: node reference.mjs swiftshader
      - name: Cold/warm benchmark (3+3 runs per scene)
        working-directory: spike/harness
        run: node bench-scenes.mjs 3 | tee out/bench.jsonl
      - name: Pixel comparison
        working-directory: spike/harness
        run: for s in pbr soldier tokyo; do node compare.mjs out/$s-vulkan.png out/$s-chrome-swiftshader.png out/$s-diff.png; done | tee out/compare.jsonl
      - name: Stability (100 frames, 50 context cycles)
        working-directory: spike/harness
        run: TERMINATE=0 node --expose-gc stress.mjs soldier 100 50 | tee out/stress.jsonl
      - name: Package size
        run: |
          echo "{\"unpackedMB\": $(du -sk pkg | cut -f1 | awk '{printf "%.1f", $1/1024}'), \"tgzMB\": $(tar czf - -C pkg . | wc -c | awk '{printf "%.1f", $1/1048576}')}" | tee spike/harness/out/size.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.id }}", path: spike/harness/out }
