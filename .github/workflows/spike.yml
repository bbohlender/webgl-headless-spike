name: spike

# One stack on every platform: Node addon -> ANGLE (Vulkan backend only) -> Mesa lavapipe.
# angle + mesa build the two native pieces per platform; test runs the identical test set.
on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platform ids
        default: mac-arm64,mac-x64,win-x64,linux-x64,linux-arm64
  push:
    branches: [main]

env:
  ANGLE_COMMIT: 3e8d04799eaee75e192e00578ff66b28c4fb95ce
  MESA_VERSION: 26.2.4
  LLVM_VERSION: 23.1.3
  DEPOT_TOOLS_UPDATE: "0"
  DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
  GCLIENT_SUPPRESS_GIT_VERSION_WARNING: "1"

jobs:
  # Platform table; build_os builds ANGLE, os builds Mesa and runs the tests (linux-arm64 ANGLE is cross-compiled).
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          WANTED: ${{ inputs.platforms || 'mac-arm64,mac-x64,win-x64,linux-x64,linux-arm64' }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          all = [
              {"id": "mac-arm64", "build_os": "macos-15", "os": "macos-15", "cpu": "arm64"},
              {"id": "mac-x64", "build_os": "macos-15-intel", "os": "macos-15-intel", "cpu": "x64"},
              {"id": "win-x64", "build_os": "windows-2022", "os": "windows-2022", "cpu": "x64"},
              {"id": "linux-x64", "build_os": "ubuntu-24.04", "os": "ubuntu-24.04", "cpu": "x64"},
              {"id": "linux-arm64", "build_os": "ubuntu-24.04", "os": "ubuntu-24.04-arm", "cpu": "arm64"},
          ]
          wanted = os.environ["WANTED"].split(",")
          print("matrix=" + json.dumps({"include": [p for p in all if p["id"] in wanted]}))
          PY

  angle:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.build_os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Free disk (Linux)
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: depot_tools
        run: |
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          git config --global core.longpaths true
      - name: Bootstrap depot_tools (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          DEPOT_TOOLS_UPDATE: "1"
        run: |
          cd /d %RUNNER_TEMP%\depot_tools
          call update_depot_tools.bat
      - name: Bootstrap depot_tools (Unix)
        if: runner.os != 'Windows'
        run: cd "$RUNNER_TEMP/depot_tools" && ./ensure_bootstrap
      - name: Fetch ANGLE
        run: |
          mkdir angle && cd angle
          git init -q && git remote add origin https://chromium.googlesource.com/angle/angle
          git fetch -q --depth 1 origin "$ANGLE_COMMIT" && git checkout -q FETCH_HEAD
          python3 ../spike/ci/write_gclient.py ${{ matrix.id }} > .gclient
      - name: gclient sync (Unix)
        if: runner.os != 'Windows'
        working-directory: angle
        run: gclient sync --no-history -j 8
      - name: gclient sync (Windows)
        if: runner.os == 'Windows'
        working-directory: angle
        shell: cmd
        run: gclient sync --no-history -j 8
      - name: arm64 sysroot (Linux cross build)
        if: matrix.id == 'linux-arm64'
        working-directory: angle
        run: python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
      - name: Use the newest installed Windows SDK
        if: runner.os == 'Windows'
        working-directory: angle
        run: |
          # The pinned Chromium toolchain targets VS 2026 + SDK 10.0.28000; runners may have an older SDK.
          sdk=$(ls "/c/Program Files (x86)/Windows Kits/10/Include" | grep '^10\.' | sort -V | tail -1)
          echo "Using Windows SDK $sdk"
          sed -i "s/^SDK_VERSION = '.*'/SDK_VERSION = '$sdk'/" build/vs_toolchain.py build/toolchain/win/setup_toolchain.py
          # NTDDI_WIN11_BR only exists in SDK 28000; older SDKs know NTDDI_WIN11_GE as their newest.
          [ "$sdk" = "10.0.28000.0" ] || sed -i 's/NTDDI_VERSION=NTDDI_WIN11_BR/NTDDI_VERSION=NTDDI_WIN11_GE/' build/config/win/BUILD.gn
      - name: Patch (skip window-system sources with the null display)
        working-directory: angle
        run: python3 ../spike/ci/patch_angle.py
      - name: GN args
        working-directory: angle
        run: mkdir -p out/vk && python3 ../spike/ci/angle_args.py ${{ matrix.id }} ${{ matrix.cpu }} | tr ' ' '\n' > out/vk/args.gn && cat out/vk/args.gn
      - name: Build (Unix)
        if: runner.os != 'Windows'
        working-directory: angle
        run: gn gen out/vk && autoninja -C out/vk libEGL libGLESv2 third_party/SwiftShader/src/Vulkan:swiftshader_libvulkan third_party/SwiftShader/src/Vulkan:icd_file
      - name: Build (Windows)
        if: runner.os == 'Windows'
        working-directory: angle
        shell: cmd
        run: |
          call gn gen out/vk || exit /b 1
          call autoninja -C out/vk libEGL libGLESv2 third_party/SwiftShader/src/Vulkan:swiftshader_libvulkan third_party/SwiftShader/src/Vulkan:icd_file || exit /b 1
      - name: Collect
        run: |
          mkdir -p ../pkg && cd out/vk
          for f in libEGL.dylib libGLESv2.dylib libEGL.so libGLESv2.so libEGL.dll libGLESv2.dll vulkan-1.dll libvk_swiftshader.dylib libvk_swiftshader.so vk_swiftshader.dll vk_swiftshader_icd.json; do [ -f "$f" ] && cp "$f" ../../../pkg/ || true; done
          ls -la ../../../pkg
        working-directory: angle
      - uses: actions/upload-artifact@v4
        with: { name: "angle-${{ matrix.id }}", path: pkg }

  mesa:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install meson ninja mako pyyaml packaging
      - name: Deps (macOS)
        if: runner.os == 'macOS'
        run: brew install bison glslang
      - name: Deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq bison flex glslang-tools libexpat1-dev zlib1g-dev libdrm-dev
      - name: Deps (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install -y winflexbison3
          curl -sfLo glslang.zip https://github.com/KhronosGroup/glslang/releases/download/main-tot/glslang-main-windows-x86_64-release.zip
          7z x -oglslang glslang.zip > /dev/null
          # Current glslang releases ship glslang.exe only (formerly glslangValidator); passed to Meson explicitly.
          echo "GLSLANG_EXE=$(cygpath -m "$PWD/glslang/bin/glslang.exe")" >> "$GITHUB_ENV"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # Minimal LLVM, identical on every platform: one CPU target, no zlib/zstd, size-optimized; cached.
      - uses: actions/cache@v4
        id: llvm-cache
        with:
          path: llvm
          key: llvm-min-${{ env.LLVM_VERSION }}-${{ matrix.id }}-2
      - name: LLVM source
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          # In Git Bash, tar is GNU tar; Windows' System32 tar.exe (bsdtar 3.8.4) hangs on LLVM's .tar.xz archives.
          curl -fsSL --max-time 600 "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src.tar.xz" -o llvm-src.tar.xz
          src="llvm-project-$LLVM_VERSION.src"
          tar -xJf llvm-src.tar.xz "$src/llvm" "$src/cmake" "$src/third-party" "$src/libc" || true  # 3 irrelevant symlinks fail on Windows
          test -f "$src/llvm/CMakeLists.txt" && mv "$src" llvm-src
      - name: LLVM build (Unix)
        if: runner.os != 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          target=$([ "${{ matrix.cpu }}" = arm64 ] && echo AArch64 || echo X86)
          cmake -S llvm-src/llvm -B llvm-build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel -DCMAKE_INSTALL_PREFIX="$PWD/llvm" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DLLVM_TARGETS_TO_BUILD=$target -DLLVM_BUILD_TOOLS=OFF -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_TERMINFO=OFF -DLLVM_ENABLE_LIBEDIT=OFF -DLLVM_ENABLE_RTTI=ON
          ninja -C llvm-build install-llvm-libraries install-llvm-headers install-cmake-exports llvm-config
          mkdir -p llvm/bin && cp llvm-build/bin/llvm-config llvm/bin/
      - name: LLVM build (Windows)
        if: runner.os == 'Windows' && steps.llvm-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          cmake -S llvm-src/llvm -B llvm-build -G Ninja -DCMAKE_BUILD_TYPE=MinSizeRel "-DCMAKE_INSTALL_PREFIX=$PWD/llvm" `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL `
            -DLLVM_TARGETS_TO_BUILD=X86 -DLLVM_BUILD_TOOLS=OFF -DLLVM_INCLUDE_TESTS=OFF -DLLVM_INCLUDE_EXAMPLES=OFF -DLLVM_INCLUDE_BENCHMARKS=OFF `
            -DLLVM_INCLUDE_DOCS=OFF -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_RTTI=ON
          if ($LASTEXITCODE) { exit 1 }
          ninja -C llvm-build install-llvm-libraries install-llvm-headers install-cmake-exports llvm-config
          if ($LASTEXITCODE) { exit 1 }
          New-Item -ItemType Directory -Force llvm/bin | Out-Null
          Copy-Item llvm-build/bin/llvm-config.exe llvm/bin/
      - name: LLVM for Meson
        run: echo "LLVM_CONFIG_EXE=$( [ "$RUNNER_OS" = Windows ] && cygpath -m "$PWD/llvm/bin/llvm-config.exe" || echo "$PWD/llvm/bin/llvm-config")" >> "$GITHUB_ENV"
      - name: Fetch Mesa
        run: curl -fsSL --max-time 600 "https://archive.mesa3d.org/mesa-$MESA_VERSION.tar.xz" | /usr/bin/tar xJ
      - name: Configure + build (Unix)
        if: runner.os != 'Windows'
        run: |
          cd "mesa-$MESA_VERSION"
          printf "[binaries]\nllvm-config = '$LLVM_CONFIG_EXE'\n" > tools.ini
          [ "$RUNNER_OS" = macOS ] && export PATH="$(brew --prefix)/opt/bison/bin:$PATH" MACOSX_DEPLOYMENT_TARGET=12.0
          meson setup build --native-file tools.ini --prefix="$PWD/../out" --buildtype=minsize -Db_ndebug=true -Dstrip=true \
            -Dgallium-drivers=llvmpipe -Dvulkan-drivers=swrast -Dplatforms= -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled \
            -Dopengl=false -Dllvm=enabled -Dshared-llvm=disabled -Dshader-cache=enabled -Dgbm=disabled -Dvideo-codecs= -Dtools= \
            -Dzstd=disabled -Dspirv-tools=disabled -Dvulkan-layers= -Dxmlconfig=disabled -Dlibunwind=disabled -Dvalgrind=disabled -Dlmsensors=disabled
          ninja -C build install
      - name: Configure + build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd "mesa-$env:MESA_VERSION"
          # Mesa's disk shader cache is not implemented on Windows (meson.build); ANGLE's blob cache still applies.
          # --buildtype=release (/O2) as in Mesa's own Windows builds: MSVC 14.44 crashes (C1001) on u_vbuf.c at /O1.
          # Mesa's Windows code needs its "windows" platform (Win32 Vulkan types); ANGLE's null display never uses its WSI.
          "[binaries]`nglslangValidator = '$env:GLSLANG_EXE'`nllvm-config = '$env:LLVM_CONFIG_EXE'" | Set-Content tools.ini
          Get-Content tools.ini
          meson setup build --native-file tools.ini "--prefix=$PWD/../out" --buildtype=release -Db_ndebug=true -Db_vscrt=md --backend=ninja `
            -Dgallium-drivers=llvmpipe -Dvulkan-drivers=swrast -Dplatforms=windows -Dglx=disabled -Degl=disabled -Dgles1=disabled -Dgles2=disabled `
            -Dopengl=false -Dllvm=enabled -Dshared-llvm=disabled -Dshader-cache=disabled -Dgbm=disabled -Dvideo-codecs= -Dtools= `
            -Dzstd=disabled -Dspirv-tools=disabled -Dvulkan-layers= -Dxmlconfig=disabled -Dmicrosoft-clc=disabled -Dgallium-d3d12-video=disabled
          if ($LASTEXITCODE) { exit 1 }
          ninja -C build install
          if ($LASTEXITCODE) { exit 1 }
      - name: Collect
        run: |
          mkdir -p pkg
          find out \( -name 'libvulkan_lvp.*' -o -name 'vulkan_lvp.dll' \) -exec cp {} pkg/ \;
          ls -la pkg
      - uses: actions/upload-artifact@v4
        with: { name: "mesa-${{ matrix.id }}", path: pkg }

  test:
    needs: [plan, angle, mesa]
    if: always() && needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DRIVERS: lavapipe,swiftshader  # both bundled drivers, same job and runner; each uses all runner cores
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: "angle-${{ matrix.id }}", path: pkg }
      - uses: actions/download-artifact@v4
        with: { name: "mesa-${{ matrix.id }}", path: pkg }
      - name: Package layout
        run: |
          node spike/ci/write_icd.mjs pkg
          ls -la pkg
          echo "ANGLE_DIR=$PWD/pkg" >> "$GITHUB_ENV"
          echo "CACHE_DIR=$RUNNER_TEMP/shader-cache" >> "$GITHUB_ENV"
          echo "MESA_SHADER_CACHE_DIR=$RUNNER_TEMP/shader-cache" >> "$GITHUB_ENV"
      - name: Addon (Unix)
        if: runner.os != 'Windows'
        run: spike/harness/addon/build.sh
      - name: Addon (Windows)
        if: runner.os == 'Windows'
        working-directory: spike/harness/addon
        run: |
          python gen.py
          npx --yes node-gyp@11 rebuild
          cp build/Release/webgl.node webgl.node
      - name: npm ci + models
        working-directory: spike/harness
        run: npm ci && node prep-models.mjs && mkdir -p out
      - name: Smoke (renderer string)
        working-directory: spike/harness
        env:
          VK_LOADER_DEBUG: error,warn,driver
        run: cat ../../pkg/*icd.json && node render.mjs pbr out/smoke-lvp.png --driver lavapipe && node render.mjs pbr out/smoke-sws.png --driver swiftshader
      - name: Cold/warm benchmark (3+3 runs per scene)
        working-directory: spike/harness
        run: node bench-scenes.mjs 3 | tee out/bench.jsonl
      - name: Pixel comparison
        working-directory: spike/harness
        run: for d in lavapipe swiftshader; do for s in pbr soldier tokyo; do node compare.mjs out/$s-$d.png reference/$s.png out/$s-$d-diff.png; done; done | tee out/compare.jsonl
      - name: Stability (100 frames, 50 context cycles)
        working-directory: spike/harness
        run: for d in lavapipe swiftshader; do DRIVER=$d TERMINATE=0 node --expose-gc stress.mjs soldier 100 50 | sed "s/^{/{\"driver\":\"$d\",/"; done | tee out/stress.jsonl
      - name: Package size (ANGLE + one driver)
        working-directory: pkg
        run: |
          shopt -s nullglob
          common=$(echo libEGL.* libGLESv2.* vulkan-1.*)
          size() { echo "\"$1\": {\"unpackedMB\": $(du -ck $2 | tail -1 | cut -f1 | awk '{printf "%.1f", $1/1024}'), \"tgzMB\": $(tar czf - $2 | wc -c | awk '{printf "%.1f", $1/1048576}')}"; }
          echo "{ $(size lavapipe "$common $(echo *vulkan_lvp.* lvp_icd.json)"), $(size swiftshader "$common $(echo *vk_swiftshader.* vk_swiftshader_icd.json)") }" | tee ../spike/harness/out/size.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.id }}", path: spike/harness/out }
