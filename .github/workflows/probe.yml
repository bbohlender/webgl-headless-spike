name: probe
on:
  workflow_dispatch:
    inputs:
      run_id: { required: true }
jobs:
  probe:
    runs-on: windows-2022
    defaults: { run: { shell: bash } }
    env:
      DRAWCALL_WEBGL_NATIVE: ${{ github.workspace }}/dist/win32-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: package-win32-x64, path: dist/win32-x64, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - run: npm ci
      - name: Threads
        run: |
          cat > probe.mjs <<'JS'
          import { openScene } from "./test/render.js";
          const view = await openScene("tokyo");
          for (let i = 0; i < 3; i++) view.render();
          const cpu = process.cpuUsage(), t = performance.now();
          for (let i = 0; i < 10; i++) view.render();
          const wall = performance.now() - t, used = process.cpuUsage(cpu);
          console.log(`LP_NUM_THREADS=${process.env.LP_NUM_THREADS ?? "default"} frame ${(wall / 10).toFixed(0)} ms, cpu/wall ${((used.user + used.system) / 1000 / wall).toFixed(2)}`);
          view.close();
          JS
          nproc
          node probe.mjs
          LP_NUM_THREADS=4 node probe.mjs
          LP_NUM_THREADS=1 node probe.mjs
