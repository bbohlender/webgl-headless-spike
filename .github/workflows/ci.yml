name: ci

# Per platform: angle builds ANGLE, driver builds lavapipe and the addon, test assembles the platform
# package (dist/<platform>-<arch>), checks its native dependencies and runs the tests and the
# benchmark, and compat reruns the tests on the oldest supported Linux (Debian 11, glibc 2.31).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated platforms
        default: darwin-arm64,darwin-x64,win32-x64,linux-x64,linux-arm64

env:
  ANGLE_COMMIT: 3e8d04799eaee75e192e00578ff66b28c4fb95ce
  DEPOT_TOOLS_UPDATE: "0"
  DEPOT_TOOLS_WIN_TOOLCHAIN: "0"
  GCLIENT_SUPPRESS_GIT_VERSION_WARNING: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      all: ${{ steps.plan.outputs.all }}
      linux: ${{ steps.plan.outputs.linux }}
    steps:
      - id: plan
        env:
          WANTED: ${{ inputs.platforms || 'darwin-arm64,darwin-x64,win32-x64,linux-x64,linux-arm64' }}
        # angle_os builds ANGLE (linux-arm64 is cross-compiled); os builds the rest and runs the tests,
        # in container on Linux (manylinux_2_28: glibc 2.28, for binaries that run on older systems).
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          platforms = [
              {"id": "darwin-arm64", "platform": "darwin", "cpu": "arm64", "angle_os": "macos-15", "os": "macos-15", "container": ""},
              {"id": "darwin-x64", "platform": "darwin", "cpu": "x64", "angle_os": "macos-15-intel", "os": "macos-15-intel", "container": ""},
              {"id": "win32-x64", "platform": "win32", "cpu": "x64", "angle_os": "windows-2022", "os": "windows-2022", "container": ""},
              {"id": "linux-x64", "platform": "linux", "cpu": "x64", "angle_os": "ubuntu-24.04", "os": "ubuntu-24.04", "container": "quay.io/pypa/manylinux_2_28_x86_64"},
              {"id": "linux-arm64", "platform": "linux", "cpu": "arm64", "angle_os": "ubuntu-24.04", "os": "ubuntu-24.04-arm", "container": "quay.io/pypa/manylinux_2_28_aarch64"},
          ]
          wanted = [p for p in platforms if p["id"] in os.environ["WANTED"].split(",")]
          print("all=" + json.dumps({"include": wanted}))
          print("linux=" + json.dumps({"include": [p for p in wanted if p["platform"] == "linux"]}))
          PY

  angle:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.all) }}
    runs-on: ${{ matrix.angle_os }}
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: angle-out
          key: angle-${{ env.ANGLE_COMMIT }}-${{ matrix.id }}-${{ hashFiles('deps/angle/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Free disk (Linux)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: depot_tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"
          git config --global core.longpaths true
      - name: Bootstrap depot_tools (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        shell: cmd
        env:
          DEPOT_TOOLS_UPDATE: "1"
        run: |
          cd /d %RUNNER_TEMP%\depot_tools
          call update_depot_tools.bat
      - name: Bootstrap depot_tools (Unix)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        run: cd "$RUNNER_TEMP/depot_tools" && ./ensure_bootstrap
      - name: Fetch ANGLE
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir angle && cd angle
          git init -q && git remote add origin https://chromium.googlesource.com/angle/angle
          git fetch -q --depth 1 origin "$ANGLE_COMMIT" && git checkout -q FETCH_HEAD
          python3 ../deps/angle/gclient.py > .gclient
      - name: gclient sync (Unix)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        working-directory: angle
        run: gclient sync --no-history -j 8
      - name: gclient sync (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        working-directory: angle
        shell: cmd
        run: gclient sync --no-history -j 8
      - name: arm64 sysroot (Linux cross build)
        if: steps.cache.outputs.cache-hit != 'true' && matrix.id == 'linux-arm64'
        working-directory: angle
        run: python3 build/linux/sysroot_scripts/install-sysroot.py --arch=arm64
      - name: Use the newest installed Windows SDK
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        working-directory: angle
        run: |
          # The pinned Chromium toolchain expects VS 2026 with SDK 10.0.28000, which runners lack.
          sdk=$(ls "/c/Program Files (x86)/Windows Kits/10/Include" | grep '^10\.' | sort -V | tail -1)
          sed -i "s/^SDK_VERSION = '.*'/SDK_VERSION = '$sdk'/" build/vs_toolchain.py build/toolchain/win/setup_toolchain.py
          # NTDDI_WIN11_BR only exists in SDK 28000; older SDKs know NTDDI_WIN11_GE as their newest.
          [ "$sdk" = "10.0.28000.0" ] || sed -i 's/NTDDI_VERSION=NTDDI_WIN11_BR/NTDDI_VERSION=NTDDI_WIN11_GE/' build/config/win/BUILD.gn
      - name: Configure
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: angle
        run: |
          python3 ../deps/angle/patch.py
          mkdir -p out/vk && python3 ../deps/angle/args.py ${{ matrix.platform }} ${{ matrix.cpu }} > out/vk/args.gn
      - name: Build (Unix)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os != 'Windows'
        working-directory: angle
        run: gn gen out/vk && autoninja -C out/vk libEGL libGLESv2
      - name: Build (Windows)
        if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
        working-directory: angle
        shell: cmd
        run: |
          call gn gen out/vk || exit /b 1
          call autoninja -C out/vk libEGL libGLESv2 || exit /b 1
      - name: Collect
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p angle-out
          for f in libEGL.dylib libGLESv2.dylib libEGL.so libGLESv2.so libEGL.dll libGLESv2.dll vulkan-1.dll; do
            if [ -f "angle/out/vk/$f" ]; then cp "angle/out/vk/$f" angle-out/; fi
          done
      - uses: actions/upload-artifact@v4
        with: { name: "angle-${{ matrix.id }}", path: angle-out }

  driver:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.all) }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: |
          echo /opt/python/cp312-cp312/bin >> "$GITHUB_PATH"
          dnf install -y -q bison flex
      - if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        run: brew install bison
      - name: Tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y winflexbison3
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: python -m pip install meson ninja mako pyyaml packaging
      - id: toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: toolchain-${{ matrix.id }}-${{ hashFiles('deps/env.sh', 'deps/glslang.sh', 'deps/llvm.sh') }}
      - name: glslang + LLVM
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: deps/glslang.sh "$PWD/toolchain" && deps/llvm.sh "$PWD/toolchain" ${{ matrix.cpu }}
      - name: lavapipe
        run: deps/mesa.sh "$PWD/lavapipe" "$PWD/toolchain"
      - name: Addon + collect
        run: |
          mkdir -p driver
          find lavapipe \( -name 'libvulkan_lvp.so' -o -name 'libvulkan_lvp.dylib' -o -name 'vulkan_lvp.dll' \) -exec cp {} driver/ \;
          native/build.sh driver
      - uses: actions/upload-artifact@v4
        with: { name: "driver-${{ matrix.id }}", path: driver }

  test:
    needs: [plan, angle, driver]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.all) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DRAWCALL_WEBGL_NATIVE: ${{ github.workspace }}/dist/${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: "angle-${{ matrix.id }}", path: "dist/${{ matrix.id }}" }
      - uses: actions/download-artifact@v4
        with: { name: "driver-${{ matrix.id }}", path: "dist/${{ matrix.id }}" }
      - name: Package
        run: node deps/package.js "dist/${{ matrix.id }}"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Native dependencies
        run: deps/check.sh "dist/${{ matrix.id }}"
      - run: npm ci
      - run: npm test
      - name: Benchmark
        run: mkdir -p test/out && node test/bench.js 3 | tee test/out/bench.jsonl
      - name: Package size
        run: echo "{\"unpackedMB\":$(du -sk "dist/${{ matrix.id }}" | cut -f1 | awk '{printf "%.1f",$1/1024}'),\"tgzMB\":$(tar -czf - -C dist "${{ matrix.id }}" | wc -c | awk '{printf "%.1f",$1/1048576}')}" | tee test/out/size.json
      - uses: actions/upload-artifact@v4
        with: { name: "package-${{ matrix.id }}", path: "dist/${{ matrix.id }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "results-${{ matrix.id }}", path: test/out }

  compat:
    needs: [plan, test]
    if: contains(needs.plan.outputs.linux, 'linux-')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    runs-on: ${{ matrix.os }}
    container: node:20-bullseye-slim
    env:
      DRAWCALL_WEBGL_NATIVE: ${{ github.workspace }}/dist/${{ matrix.id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "package-${{ matrix.id }}", path: "dist/${{ matrix.id }}" }
      - run: npm ci && npm test
