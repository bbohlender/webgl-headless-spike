name: diag-windows

# Finds which step hangs when fetching LLVM on Windows runners: download or .tar.xz extraction.
on: workflow_dispatch

jobs:
  diag:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.3/llvm-project-23.1.3.src.tar.xz
      SRC: llvm-project-23.1.3.src
    steps:
      - name: Download (curl, timed)
        shell: pwsh
        timeout-minutes: 15
        run: |
          curl.exe -fL --max-time 600 -o llvm.tar.xz -w "time %{time_total}s speed %{speed_download}B/s size %{size_download}B`n" $env:URL
          (Get-Item llvm.tar.xz).Length
      - name: Which tar
        shell: pwsh
        run: |
          Get-Command tar | Format-List Source
          tar --version
      - name: System tar, selected folders (as in spike.yml)
        shell: pwsh
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $t = Get-Date
          New-Item -ItemType Directory -Force a | Out-Null
          tar -xJf llvm.tar.xz -C a "$env:SRC/llvm" "$env:SRC/cmake" "$env:SRC/third-party" "$env:SRC/libc"
          "exit $LASTEXITCODE after $(((Get-Date) - $t).TotalSeconds)s"
      - name: System tar, whole archive
        shell: pwsh
        timeout-minutes: 15
        continue-on-error: true
        run: |
          $t = Get-Date
          New-Item -ItemType Directory -Force b | Out-Null
          tar -xJf llvm.tar.xz -C b
          "exit $LASTEXITCODE after $(((Get-Date) - $t).TotalSeconds)s"
      - name: Git Bash GNU tar, selected folders
        shell: bash
        timeout-minutes: 15
        continue-on-error: true
        run: |
          mkdir -p c && time tar -xJf llvm.tar.xz -C c "$SRC/llvm" "$SRC/cmake" "$SRC/third-party" "$SRC/libc"; echo "exit $?"
