name: scaling

# Thread scaling on a real VM: both drivers with the process pinned to 1, 2 and 4 CPUs,
# using the Linux x64 packages built by a previous spike run.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: spike run whose angle-linux-x64 / mesa-linux-x64 artifacts to use
        required: true

jobs:
  scaling:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/download-artifact@v4
        with: { name: angle-linux-x64, path: pkg, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { name: mesa-linux-x64, path: pkg, run-id: "${{ inputs.run_id }}", github-token: "${{ github.token }}" }
      - name: Setup
        run: |
          chmod +x pkg/*.so*; node spike/ci/write_icd.mjs pkg
          spike/harness/addon/build.sh
          cd spike/harness && npm ci && node prep-models.mjs && mkdir -p out
          nproc; lscpu | grep -E "Model name|Thread|Core|Socket"
      - name: Scaling (1, 2, 4 CPUs)
        working-directory: spike/harness
        run: |
          for cpus in 0 0,1 0-3; do
            ANGLE_DIR=$GITHUB_WORKSPACE/pkg CACHE_DIR=$RUNNER_TEMP/cache-$cpus DRIVERS=lavapipe,swiftshader \
              taskset -c $cpus node bench-scenes.mjs 2 tokyo soldier | tee -a out/scaling.jsonl
          done
      - uses: actions/upload-artifact@v4
        with: { name: scaling-linux-x64, path: spike/harness/out/scaling.jsonl }
